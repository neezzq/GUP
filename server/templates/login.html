{% extends 'layout.html' %}
{% block content %}
<section class="login card">
  <h1>Вход администратора</h1>
  {% if failed %}<p role="alert">Проверьте имя и пароль.</p>{% endif %}
  <form method="post" action="/admin/login">
    <input type="hidden" name="form_token" value="{{ csrf }}">
    <label>Имя<input name="name" required maxlength="80" autocomplete="username"></label>
    <label>Пароль<input name="password" type="password" required maxlength="512" autocomplete="current-password"></label>
    <button class="primary">Войти</button>
  </form>
</section>
{% endblock %}
