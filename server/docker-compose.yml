services:
  backend:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - gup_data:/data
    secrets: [gup_keys]
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      NO_PROXY: backend,localhost,127.0.0.1
      no_proxy: backend,localhost,127.0.0.1
      GUP_DOMAIN: ${GUP_DOMAIN:?Set GUP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      private:
        ipv4_address: 172.29.55.3
      public: {}
    depends_on:
      backend:
        condition: service_healthy
secrets:
  gup_keys:
    file: ./secrets/keys.json
networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.29.55.0/24
  public: {}
volumes:
  gup_data: {}
  caddy_data: {}
  caddy_config: {}
