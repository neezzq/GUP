name: Windows x64
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            server/requirements.txt
            client/requirements.txt
      - name: Test and package
        shell: cmd
        run: call client\build.bat
      - name: Launch packaged application
        shell: pwsh
        run: |
          $binary = Start-Process -FilePath dist/GameUpdater.exe -ArgumentList '--smoke-test','--verify-uia' -PassThru
          if (-not $binary.WaitForExit(30000)) {
            Stop-Process -Id $binary.Id -Force
            throw 'GameUpdater smoke test timed out'
          }
          if ($binary.ExitCode -ne 0) { throw "Smoke exit code $($binary.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: GameUpdater-Windows-x64
          if-no-files-found: error
          path: |
            dist/GameUpdater.exe
            dist/GameUpdater.exe.sha256
            THIRD_PARTY.md
